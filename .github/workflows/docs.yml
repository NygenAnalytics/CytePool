name: Docs

on:
  # The GitHub Pages workflow builds the site for docs.nygen.io/CytePool/ with this one.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out and build
        type: string
        required: true
      pages:
        description: Build the site for GitHub Pages and store it for deployment
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - "docs/**"
      - "cytepool/**"
      - "validation/**"
      - "tests/test_documentation.py"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.13"
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
    - name: Install dependencies
      run: uv sync --locked --extra test --group docs
    - name: Documentation tests
      run: uv run pytest tests/test_documentation.py
    - name: Lint and check formatting of the documentation scripts
      run: |
        uv run ruff check docs
        uv run ruff format --check docs
    - name: Build the API reference and the site
      # Notebooks are executed locally and committed with their outputs; the
      # build checks that they are current and runs no code. The site is served
      # below /CytePool/ of docs.nygen.io.
      env:
        BASE_URL: ${{ inputs.pages && '/CytePool' || '' }}
      run: make -C docs html
    - name: Check that saved notebook outputs still match the package
      # Runs pages that need no downloaded data, without saving them, and fails
      # when what they print has changed. Add such pages to PAGES.
      run: make -C docs check-outputs PAGES="quickstart differential_expression guides/export_cubes guides/bulk_rna_seq guides/composition"
    - name: Store the site
      if: ${{ !inputs.pages }}
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: docs/build/site/_build/html/
        if-no-files-found: error
    - name: Store the site for GitHub Pages
      if: ${{ inputs.pages }}
      # Served at docs.nygen.io/CytePool/ by the organization site, which owns the
      # root of docs.nygen.io.
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs/build/site/_build/html/
